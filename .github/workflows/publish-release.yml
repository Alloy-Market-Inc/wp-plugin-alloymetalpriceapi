name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: "8.2"
          coverage: none
      - id: contract
        run: npm run validate:release
      - run: npm ci
      - run: npm run package
      - name: Publish immutable package
        run: >-
          npm run publish-release --
          "${{ steps.contract.outputs.version }}"
          "build/AlloyMetalPriceAPI.zip"
          "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
        env:
          UPDATE_SERVICE_URL: ${{ vars.UPDATE_SERVICE_URL }}
          UPDATE_SERVICE_PUBLISHER_TOKEN: ${{ secrets.UPDATE_SERVICE_PUBLISHER_TOKEN }}
          UPDATE_SERVICE_READ_TOKEN: ${{ secrets.UPDATE_SERVICE_READ_TOKEN_PRODUCTION }}
