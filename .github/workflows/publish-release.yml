name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: Alloy-Market-Inc/wp-site-alloy-marcom/.github/workflows/component-publish.yml@release
    with:
      manifest_path: alloy-component.json
      release_ref: ${{ github.ref }}
      recovery_tag: ""
    secrets:
      UPDATE_SERVICE_PUBLISHER_TOKEN: ${{ secrets.UPDATE_SERVICE_PUBLISHER_TOKEN }}
      UPDATE_SERVICE_READ_TOKEN_STAGING: ${{ secrets.UPDATE_SERVICE_READ_TOKEN_STAGING }}
